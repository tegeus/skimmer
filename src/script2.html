    const fillPat = (pat, dx, dy) => { dx = ((dx % 256) + 256) % 256; dy = ((dy % 256) + 256) % 256; sg.setTransform(1, 0, 0, 1, dx, dy); sg.fillStyle = pat; sg.fillRect(-dx, -dy, CS, CS); sg.setTransform(1, 0, 0, 1, 0, 0); };
    sg.globalCompositeOperation = "source-over"; sg.clearRect(0, 0, CS, CS);
    fillPat(patA, t * 13, t * 4);
    sg.globalCompositeOperation = "destination-in"; fillPat(patB, -t * 9, t * 6);   // glints live where two drifting layers cross
    sg.globalCompositeOperation = "source-over"; fillPat(patC, t * 5, t * 2);        // slow, broad bands of reflected sky
    sg.globalCompositeOperation = "destination-in"; sg.drawImage(c.water, 0, 0);
    ctx.globalCompositeOperation = "lighter"; ctx.drawImage(scratch, x, y); ctx.globalCompositeOperation = "source-over";
  }
  function drawParticles(front, surface) {
    const sd = ship.x + ship.y;
    for (const p of P) {
      const flat = p.k >= 2;
      if (flat !== surface) continue;
      if (!flat && (p.x + p.y > sd) !== front) continue;
      const k = p.life / p.max, s = proj(p.x, p.y, p.z * PX);
      if (p.k === 0) {
        const size = mix(p.s0, p.s1, 1 - (1 - k) * (1 - k));
        ctx.globalAlpha = p.a * Math.min(1, k * 8) * Math.pow(1 - k, 1.4);
        ctx.drawImage(p.sp, s[0] - size / 2, s[1] - size * 0.4, size, size * 0.75);
      } else if (p.k === 1) {
        ctx.globalAlpha = (p.al || 0.75) * (1 - k * k); ctx.fillStyle = p.col || "#eef6f6"; ctx.fillRect(s[0], s[1], p.sz || 1.6, p.sz || 1.6);
      } else if (p.k === 2) {
        const size = mix(p.s0, p.s1, k); ctx.globalAlpha = p.a * Math.min(1, k * 6) * (1 - k);
        ctx.drawImage(p.sp, s[0] - size / 2, s[1] - size / 4, size, size / 2);
      } else {
        const r = p.r0 + p.gr * p.life; ctx.globalAlpha = 0.4 * Math.pow(1 - k, 1.5); ctx.strokeStyle = "#e6f2f2"; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.ellipse(s[0], s[1], r * 45.25, r * 22.6, 0, 0, 7); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }
  function drawStreamers() {
    const ang = Math.atan2((CW + SW) * TH / 2, (CW - SW) * TW / 2);
    for (const s of streamers) {
      if (!s.ok || s.life > s.max) continue;
      const p = proj(s.x, s.y, surfaceAt(s.x, s.y) * PX + 2);
      ctx.save(); ctx.globalAlpha = 0.16 * Math.sin(Math.PI * s.life / s.max); ctx.translate(p[0], p[1]); ctx.rotate(ang);
      ctx.drawImage(puffs[0], -45, -4, 90, 8); ctx.restore();
    }
  }
  function drawPointer() {
    if (!pointer.active) return;
    const [gx, gy] = unproj(pointer.sx, pointer.sy, ship.z), g = proj(gx, gy, surfaceAt(gx, gy) * PX);
    const hot = mode === "hold" && (pointer.down || spaceDown);
    ctx.strokeStyle = hot ? "rgba(255,230,120,0.95)" : "rgba(255,255,255,0.8)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(g[0], g[1], 9, 4.5, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = ctx.strokeStyle; ctx.fillRect(pointer.sx - 1, pointer.sy - 1, 3, 3);
  }
  const grade = mk(W, H); {
    const g = grade.getContext("2d"), v = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.85);
    v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(40,18,6,0.42)"); g.fillStyle = v; g.fillRect(0, 0, W, H);
    const l = g.createLinearGradient(0, 0, W, H); l.addColorStop(0, "rgba(255,210,150,0.10)"); l.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = l; g.fillRect(0, 0, W, H);
  }
  function draw() {
    ctx.fillStyle = "#c7a377"; ctx.fillRect(0, 0, W, H);
    const cx0 = Math.floor(-ox / CS), cx1 = Math.floor((-ox + W - 1) / CS), cy0 = Math.floor(-oy / CS), cy1 = Math.floor((-oy + H - 1) / CS);
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      const c = chunks.get(cx + "," + cy); if (!c || !c.canvas) continue;
      ctx.drawImage(c.canvas, cx * CS + ox, cy * CS + oy);
      if (c.water) drawWater(c, cx * CS + ox, cy * CS + oy);
    }
    drawStreamers();
    drawParticles(false, true);
    const st = ship.x + ship.y;
    const vis = near.filter(t => { const x = t.ix + ox, y = t.iy + oy; return x > -100 && x < W + 100 && y > -20 && y < H + 220; });
    const tree = t => {
      const bx = Math.round(t.ix) + ox, by = Math.round(t.iy) + oy;
      let ang = 0;
      if (t.dead) { const k = Math.min(1, (time - t.fallT) / FALL); ang = t.fallDir * 1.48 * k * k; }
      else if (t.shake > 0) ang = Math.sin(time * 70) * 0.05 * t.shake / 0.3;
      if (!ang) { ctx.drawImage(t.s.c, bx - t.s.ax, by - t.s.ay); return; }
      ctx.save(); ctx.translate(bx, by); ctx.rotate(ang);
      if (t.landed) ctx.filter = "brightness(0.8) saturate(0.7)";
      ctx.drawImage(t.s.c, -t.s.ax, -t.s.ay); ctx.restore();
    };
    for (const t of vis) if (t.x + t.y <= st) tree(t);
    drawParticles(false, false);
    drawShip();
    drawParticles(true, false);
    for (const t of vis) if (t.x + t.y > st) tree(t);
    drawBolts();
    ctx.drawImage(grade, 0, 0);
    drawPointer();
    const sp = Math.hypot(ship.vx, ship.vy), frac = Math.min(1, sp / T.maxSpeed);
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(10, H - 18, 132, 8);
    ctx.fillStyle = frac > 0.9 ? "#ff6a3a" : frac > 0.6 ? "#ffd24a" : "#9fe07a"; ctx.fillRect(12, H - 16, Math.round(128 * frac), 4);
  }

  // ---------- HUD ----------
  const hudDown = document.getElementById("hudDown"), hudSpeed = document.getElementById("hudSpeed"), hudDrift = document.getElementById("hudDrift"), hudAlt = document.getElementById("hudAlt"), hudOver = document.getElementById("hudOver");
  function hud() {
    const sp = Math.hypot(ship.vx, ship.vy);
    hudSpeed.textContent = sp.toFixed(1);
    hudDrift.textContent = Math.round(sp > 0.3 ? Math.abs(wrapAng(Math.atan2(ship.vy, ship.vx) - ship.a)) * 180 / Math.PI : 0) + "°";
    hudAlt.textContent = Math.max(0, ship.z - surfaceAt(ship.x, ship.y) - T.hover).toFixed(1);
    hudOver.textContent = overKind; hudDown.textContent = treesDown;
  }

  // ---------- Boot ----------
  let last = performance.now(), acc = 0, hudT = 0, ready = false;
  const DT = 1 / 120, t0 = performance.now();
  function frame(now) {
    const el = Math.min(0.1, (now - last) / 1000); last = now;
    setCam(); pumpChunks(); refreshNear();
    if (!ready && screenReady()) { ready = true; window.__genMs = Math.round(performance.now() - t0); document.getElementById("loading").hidden = true; }
    if (ready) {
      acc += el; time += el;
      while (acc >= DT) { step(DT); acc -= DT; }
      stepParticles(el); setCam(); draw();
      hudT += el; if (hudT > 0.1) { hud(); hudT = 0; }
      window.__aim = () => { const t = near.filter(t => !t.dead).sort((a, b) => Math.hypot(a.x - ship.x, a.y - ship.y) - Math.hypot(b.x - ship.x, b.y - ship.y))[0]; return t ? [t.ix + ox, t.iy + oy - 6] : null; };
      window.__stats = { gun: gunStats, down: treesDown, bolts: bolts.length, chunks: chunks.size, particles: P.length, trees: near.length, x: ship.x, y: ship.y, workers: workerOK };
    }
    requestAnimationFrame(frame);
  }
  setTimeout(() => {
    buildSprites();
    patA = sg.createPattern(shimA, "repeat"); patB = sg.createPattern(shimB, "repeat"); patC = sg.createPattern(shimC, "repeat");
    home(); last = performance.now(); requestAnimationFrame(frame);
  }, 30);
})();
</script>
